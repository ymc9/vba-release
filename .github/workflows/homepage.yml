# When a release is published, write its version, date and download links into the homepage and
# commit, which redeploys GitHub Pages (served from main, /docs).
name: Update homepage

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
        # On a release event use its payload; on a manual run take the latest published release.
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            jq .release "$GITHUB_EVENT_PATH" > release.json
          else
            gh api repos/${{ github.repository }}/releases/latest > release.json
          fi
      - run: node scripts/update-homepage.mjs release.json
      - name: Commit
        run: |
          tag=$(jq -r .tag_name release.json)
          rm release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Homepage: $tag"
          git push
